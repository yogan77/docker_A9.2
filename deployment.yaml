apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-portal-deployment
  labels:
    app: event-portal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: event-portal
  template:
    metadata:
      labels:
        app: event-portal
    spec:
      containers:
      - name: portal-container
        image: DOCKERHUB_USERNAME/event-portal:BUILD_NUMBER
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        # Readiness Probe ensures traffic is only sent to healthy pods
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # Liveness Probe ensures unhealthy container processes are restarted automatically
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: event-portal-service
spec:
  type: NodePort
  selector:
    app: event-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32080
